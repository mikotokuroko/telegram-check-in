name: Daily Telegram check-in

on:
  schedule:
    - cron: '0 0 * * *'
      timezone: Australia/Melbourne
  workflow_dispatch:
    inputs:
      send:
        description: Send real messages (leave unchecked for offline validation)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: telegram-check-in
  cancel-in-progress: false

jobs:
  check-in:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest -v
      - name: Validate configuration offline
        run: python check_in.py
        env:
          TELEGRAM_RECIPIENTS: ${{ secrets.TELEGRAM_RECIPIENTS }}
      - name: Send daily check-in
        if: >-
          vars.CHECK_IN_ENABLED == 'true' && github.run_attempt == 1 &&
          (github.event_name == 'schedule' || inputs.send == true)
        run: python check_in.py --send
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          TELEGRAM_RECIPIENTS: ${{ secrets.TELEGRAM_RECIPIENTS }}
